name: 'Setup uv environment'
description: 'Install uv, Python, and sync dependencies'
inputs:
  python-version:
    description: 'Python version to install'
    required: false
    # The newest supported version; used by jobs that don't pin one explicitly.
    default: '3.14'
runs:
  using: 'composite'
  steps:
    - name: install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: install Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}
    - name: install the project
      # `--locked` fails if uv.lock is missing or out of sync with pyproject.toml;
      # the lockfile is committed, so CI always tests the resolution the repo records.
      shell: bash
      run: uv sync --locked --dev --python ${{ inputs.python-version }}
