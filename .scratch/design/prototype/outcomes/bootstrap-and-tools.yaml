      platform: linux-64
    annotations:
      path: /home/markus/.freckles/envs/8c2d77/bin/talosctl
      realized_at: "2026-08-21T09:21:19Z"
  provenance:                           # bafy_PROV_TOOL_TALOSCTL
    schema: 1
    plugin: { cid: bafy_PLUG_MISE_INSTALL, name: mise-install, version: 0.3.1 }
    config: { package: talosctl, version: 1.8.0 }
    inputs: { bootstrap: bafy_CLAIM_BOOTSTRAP }
